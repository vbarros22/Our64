# Compila o Our64 (versão pública, RELEASE=1) a cada push e deixa o .wuhb
# para download na aba Actions. Roda também os testes de PC.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Pacotes do devkitPro
        run: dkp-pacman -Syu --noconfirm --needed wiiu-dev ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-bzip2 ppc-zlib

      - name: CafeGLSL
        run: tools/fetch-cafeglsl.sh

      - name: Compilar
        run: make -C player RELEASE=1 -j$(nproc)

      - name: Guardar o .wuhb
        uses: actions/upload-artifact@v4
        with:
          name: our64-${{ github.ref_name }}-${{ github.sha }}
          path: player/release/our64.wuhb
          if-no-files-found: error

  testes-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make -C tests -j$(nproc)
